<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spider-hub · TVBox spider 中转</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2e; --panel2:#16223a; --line:#22304d;
    --text:#e6edf7; --dim:#8b9bb4; --accent:#4f8cff; --cyan:#22d3ee;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0b1220,#0e1728 40%,#0b1220);
       color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .logo{width:38px;height:38px;border-radius:10px;
        background:linear-gradient(135deg,var(--accent),var(--cyan));
        display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#06101f}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
  .spacer{flex:1}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
         background:var(--panel);color:var(--dim)}
  .badge.on{color:#0b1220;background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;font-weight:600}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card .k{color:var(--dim);font-size:12px;margin-bottom:6px}
  .card .v{font-size:22px;font-weight:650;letter-spacing:.5px}
  .card .v.ok{color:var(--ok)} .card .v.bad{color:var(--bad)} .card .v.accent{color:var(--cyan)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .panel h2{font-size:14.5px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .panel h2::before{content:"";width:3px;height:14px;border-radius:2px;
                    background:linear-gradient(180deg,var(--accent),var(--cyan))}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text]{flex:1;min-width:240px;background:#0c1526;border:1px solid var(--line);
       border-radius:9px;padding:10px 13px;color:var(--text);font-size:13px;outline:none;transition:.15s}
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
         padding:9px 15px;border-radius:9px;font-size:13px;cursor:pointer;transition:.15s;font-weight:500}
  button:hover{border-color:var(--accent);background:#1b2947}
  button.primary{background:linear-gradient(135deg,var(--accent),#3b74e0);border-color:transparent;font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  button.tiny{padding:4px 9px;font-size:12px;border-radius:7px}
  button:disabled{opacity:.45;cursor:not-allowed}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:12px;
     padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid rgba(34,48,77,.55);vertical-align:middle}
  tr:hover td{background:rgba(79,140,255,.05)}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
       background:#0c1526;padding:2px 6px;border-radius:5px;color:#9ec1ff}
  .st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .st.ok{background:var(--ok);box-shadow:0 0 8px rgba(34,197,94,.7)}
  .st.bad{background:var(--bad)} .st.unk{background:#475569}
  .err{color:#fca5a5;font-size:12px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  pre{background:#08101d;border:1px solid var(--line);border-radius:10px;padding:14px;
      overflow:auto;max-height:420px;font-size:12px;line-height:1.55;margin:10px 0 0;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#bfd4f5}
  .empty{color:var(--dim);text-align:center;padding:26px 0;font-size:13px}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line);
         border-left:3px solid var(--accent);padding:12px 16px;border-radius:10px;font-size:13px;
         box-shadow:0 12px 32px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);
         transition:.25s;pointer-events:none;max-width:420px}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{padding:6px 13px;border-radius:8px;font-size:12.5px;color:var(--dim);cursor:pointer;border:1px solid transparent}
  .tab.active{color:var(--text);background:var(--panel2);border-color:var(--line)}
  .hint{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.7}
  .hint code{color:#9ec1ff}
  @media(max-width:640px){
    .wrap{padding:16px 12px 50px}
    .card .v{font-size:19px}
    table{font-size:12px}
    th:nth-child(4),td:nth-child(4){display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">S</div>
    <div>
      <h1>spider-hub</h1>
      <div class="sub">把 TVBox 的 catvod spider 变成标准 MacCMS 采集站</div>
    </div>
    <div class="spacer"></div>
    <span class="badge" id="badgeStatus">连接中…</span>
  </header>

  <div class="cards">
    <div class="card"><div class="k">spider 站点</div><div class="v accent" id="kTotal">–</div></div>
    <div class="card"><div class="k">已验证可用</div><div class="v ok" id="kOk">–</div></div>
    <div class="card"><div class="k">未验证 / 失败</div><div class="v bad" id="kBad">–</div></div>
    <div class="card"><div class="k">运行时长</div><div class="v" id="kUptime" style="font-size:17px">–</div></div>
  </div>

  <div class="panel">
    <h2>配置</h2>
    <div class="row">
      <input type="text" id="configUrl" placeholder="TVBox 配置地址（http 或本机绝对路径）">
      <button class="primary" onclick="saveConfig()">保存并加载</button>
      <button onclick="reload()">重新加载</button>
    </div>
    <div class="hint">
      这里只取配置里 <code>type:3</code> + <code>api:csp_XXX</code> 的 spider 站点。
      每个站点对外的采集地址是 <code>/v/&lt;key&gt;/api.php/provide/vod/</code>，
      把它填进 Emby 插件的站点白名单即可。
    </div>
  </div>

  <div class="panel">
    <h2>站点</h2>
    <div class="tabs">
      <div class="tab active" onclick="filterSites('all',this)">全部</div>
      <div class="tab" onclick="filterSites('ok',this)">可用</div>
      <div class="tab" onclick="filterSites('bad',this)">失败/未测</div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="primary" onclick="probeAll()">批量探测全部</button>
      <button onclick="loadSites()">刷新</button>
      <span class="hint" id="probeProgress" style="margin:0"></span>
    </div>
    <div id="siteTable"></div>
  </div>

  <div class="panel">
    <h2>结果</h2>
    <div id="resultBox" class="empty">点上面任意「首页 / 分类 / 详情」按钮看返回</div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
var sites = [];
var currentFilter = 'all';

function api(path, opt) {
  return fetch(path, opt).then(function (r) { return r.json(); });
}

function toast(msg, kind) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.className = 'toast ' + (kind || ''); }, 3200);
}

function fmtUptime(s) {
  if (s < 60) return s + ' 秒';
  if (s < 3600) return Math.floor(s / 60) + ' 分';
  return Math.floor(s / 3600) + ' 时 ' + Math.floor((s % 3600) / 60) + ' 分';
}

function status() {
  api('/api/status').then(function (d) {
    var b = document.getElementById('badgeStatus');
    b.textContent = d.ok ? '运行中 · Java ' + d.javaVersion : '异常';
    b.className = 'badge' + (d.ok ? ' on' : '');
    document.getElementById('kTotal').textContent = d.stats.total;
    document.getElementById('kOk').textContent = d.stats.ok;
    document.getElementById('kBad').textContent = d.stats.unknown;
    document.getElementById('kUptime').textContent = fmtUptime(d.uptimeSec);
    if (d.configUrl && !document.getElementById('configUrl').value) {
      document.getElementById('configUrl').value = d.configUrl;
    }
  }).catch(function () {
    document.getElementById('badgeStatus').textContent = '连不上 hub';
  });
}

function loadSites() {
  api('/api/sites').then(function (d) {
    sites = d.sites || [];
    render();
  });
}

function filterSites(kind, el) {
  currentFilter = kind;
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
  if (el) el.classList.add('active');
  render();
}

function render() {
  var list = sites.filter(function (s) {
    if (currentFilter === 'ok') return s.ok;
    if (currentFilter === 'bad') return !s.ok;
    return true;
  });
  var box = document.getElementById('siteTable');
  if (!list.length) {
    box.innerHTML = '<div class="empty">没有站点。先在上面填配置地址并加载。</div>';
    return;
  }
  var html = '<table><thead><tr><th>状态</th><th>名称</th><th>key / class</th><th>采集地址</th><th>操作</th></tr></thead><tbody>';
  list.forEach(function (s, i) {
    var st = s.ok ? 'ok' : (s.lastError ? 'bad' : 'unk');
    html += '<tr>' +
      '<td><span class="st ' + st + '"></span>' +
        (s.ok ? '可用' : (s.lastError ? '失败' : '未测')) + '</td>' +
      '<td>' + esc(s.name || '') + '</td>' +
      '<td><code>' + esc(s.key) + '</code><br><span style="color:var(--dim);font-size:11.5px">' +
        esc((s.class || '').replace('com.github.catvod.spider.', 'spider.')) + '</span></td>' +
      '<td><code style="font-size:11.5px">/v/' + encodeURIComponent(s.key) + '/api.php/provide/vod/</code>' +
        (s.lastError ? '<div class="err" title="' + esc(s.lastError) + '">' + esc(s.lastError) + '</div>' : '') + '</td>' +
      '<td style="white-space:nowrap">' +
        '<button class="tiny" onclick="testHome(' + i + ',this)">首页</button> ' +
        '<button class="tiny" onclick="testCategory(' + i + ',this)">分类</button> ' +
        '<button class="tiny" onclick="testCms(' + i + ')">采集</button>' +
      '</td></tr>';
  });
  html += '</tbody></table>';
  box.innerHTML = html;
  // 保存筛选后的索引映射
  box._list = list;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function show(title, data) {
  var box = document.getElementById('resultBox');
  box.className = '';
  var json = JSON.stringify(data, null, 2);
  if (json.length > 60000) json = json.slice(0, 60000) + '\n…(截断)';
  box.innerHTML = '<div style="color:var(--dim);font-size:12.5px;margin-bottom:6px">' +
    esc(title) + '</div><pre>' + esc(json) + '</pre>';
}

function getSite(btn) {
  // 从按钮所在行反查站点
  var tr = btn.closest('tr');
  var idx = Array.prototype.indexOf.call(tr.parentNode.children, tr);
  return (document.getElementById('siteTable')._list || sites)[idx];
}

function testHome(i, btn, silent) {
  var s = (document.getElementById('siteTable')._list || sites)[i] || getSite(btn);
  if (!s) return;
  if (!silent) show('正在测试 ' + s.name + ' …', {});
  return api('/api/home?key=' + encodeURIComponent(s.key)).then(function (d) {
    if (!silent) show('首页 ' + s.name, d);
    var n = (d.parsed && d.parsed.class) ? d.parsed.class.length : 0;
    return n;
  }).catch(function (e) {
    if (!silent) show('首页失败', { error: String(e) });
    return 0;
  });
}

function testCategory(i, btn) {
  var s = (document.getElementById('siteTable')._list || sites)[i] || getSite(btn);
  if (!s) return;
  show('正在取分类 ' + s.name + ' …', {});
  api('/api/home?key=' + encodeURIComponent(s.key)).then(function (h) {
    var classes = (h.parsed && h.parsed.class) || [];
    if (!classes.length) { show(s.name + ' 没有分类', h); return; }
    var tid = classes[0].type_id;
    api('/api/category?key=' + encodeURIComponent(s.key) + '&tid=' + encodeURIComponent(tid) + '&pg=1')
      .then(function (d) { show(s.name + ' 分类 ' + classes[0].type_name + '(' + tid + ') 第1页', d); });
  });
}

function testCms(i) {
  var s = (document.getElementById('siteTable')._list || sites)[i];
  if (!s) return;
  var url = '/v/' + encodeURIComponent(s.key) + '/api.php/provide/vod/?ac=list';
  show('MacCMS 采集接口 ' + url, {});
  api(url).then(function (d) { show('MacCMS ac=list → ' + s.name, d); });
}

function probeAll() {
  var list = sites.filter(function (s) { return true; });
  if (!list.length) { toast('没有站点可测', 'bad'); return; }
  var done = 0, ok = 0;
  var box = document.getElementById('probeProgress');
  box.textContent = '0 / ' + list.length;
  function next(i) {
    if (i >= list.length) {
      toast('探测完成：' + ok + ' / ' + list.length + ' 可用', 'ok');
      box.textContent = '完成：' + ok + ' / ' + list.length + ' 可用';
      loadSites(); status();
      return;
    }
    api('/api/home?key=' + encodeURIComponent(list[i].key)).then(function (d) {
      var n = (d.parsed && d.parsed.class) ? d.parsed.class.length : 0;
      if (n > 0) ok++;
    }).catch(function () {}).then(function () {
      done++;
      box.textContent = done + ' / ' + list.length + '（可用 ' + ok + '）';
      setTimeout(function () { next(i + 1); }, 120);
    });
  }
  next(0);
}

function saveConfig() {
  var url = document.getElementById('configUrl').value.trim();
  if (!url) { toast('先填配置地址', 'bad'); return; }
  api('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ configUrl: url })
  }).then(function () {
    return api('/api/reload', { method: 'POST' });
  }).then(function (d) {
    toast(d.msg || '已加载', d.ok ? 'ok' : 'bad');
    loadSites(); status();
  }).catch(function (e) { toast('失败: ' + e, 'bad'); });
}

function reload() {
  api('/api/reload', { method: 'POST' }).then(function (d) {
    toast(d.msg || '已重新加载', d.ok ? 'ok' : 'bad');
    loadSites(); status();
  });
}

status();
loadSites();
setInterval(status, 15000);
</script>
</body>
</html>
